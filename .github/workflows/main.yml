name: Build Clock APK

on:
workflow_dispatch:
push:
paths:
- 'ClockInspiredAndroidProject.zip'
- '.github/workflows/main.yml'

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Extract project
    run: |
      sudo apt-get update
      sudo apt-get install -y unzip
      mkdir extracted
      unzip -o ClockInspiredAndroidProject.zip -d extracted
      find extracted -name settings.gradle -o -name settings.gradle.kts
      PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)")
      if [ "$PROJECT_DIR" = "extracted" ] || [ -z "$PROJECT_DIR" ]; then
        PROJECT_DIR="extracted"
      fi
      cp -a "$PROJECT_DIR"/. .

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Build APK
    run: |
      if [ -f gradlew ]; then
        chmod +x gradlew
        ./gradlew assembleDebug
      else
        echo "Gradle wrapper missing from project"
        exit 1
      fi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Clock-debug-APK
      path: app/build/outputs/apk/debug/*.apk
