name: Build Clock APK

on:
workflow_dispatch:
push:
paths:
- 'ClockInspiredAndroidProject.zip'
- '.github/workflows/main.yml'

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Extract Android project
    run: |
      unzip -o ClockInspiredAndroidProject.zip -d extracted
      if [ -f extracted/settings.gradle ]; then
        cp -a extracted/. .
      else
        dir=$(find extracted -name settings.gradle -printf '%h\n' | head -n 1)
        if [ -z "$dir" ]; then
          echo "Could not find Android project in ZIP"
          exit 1
        fi
        cp -a "$dir"/. .
      fi

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Build APK
    run: |
      chmod +x gradlew 2>/dev/null || true
      if [ -f gradlew ]; then
        ./gradlew assembleDebug
      else
        gradle assembleDebug
      fi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Clock-debug-APK
      path: app/build/outputs/apk/debug/*.apk
