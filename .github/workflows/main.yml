name: Build Clock APK

'on':
workflow_dispatch:
push:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Extract project
    run: |
      sudo apt-get update
      sudo apt-get install -y unzip
      unzip -o ClockInspiredAndroidProject.zip -d extracted
      PROJECT_DIR=$(find extracted -name settings.gradle -type f -printf '%h\n' | head -n 1)
      if [ -z "$PROJECT_DIR" ]; then
        PROJECT_DIR=$(find extracted -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)
      fi
      if [ -z "$PROJECT_DIR" ]; then
        echo "ERROR: No Gradle Android project found in ZIP"
        exit 1
      fi
      cp -a "$PROJECT_DIR"/. .

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Build APK
    run: |
      if [ ! -f gradlew ]; then
        echo "ERROR: Gradle wrapper gradlew is missing"
        exit 1
      fi
      chmod +x gradlew
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Clock-debug-APK
      path: app/build/outputs/apk/debug/*.apk
